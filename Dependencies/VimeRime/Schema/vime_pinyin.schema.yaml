# Simplified Chinese full pinyin for Vime, with English words mixed in.
# Scripts/build_rime_dicts.py generates both dictionaries from permissively
# licensed and CC BY-SA data; see Scripts/build_rime_data.sh.
schema:
  schema_id: vime_pinyin
  name: Vime 拼音
  version: "1"
  dependencies:
    - vime_english
engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
    - table_translator@english
  filters:
    - uniquifier
speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  initials: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - erase/^hm$/
    - erase/^m$/
    - erase/^n$/
    - erase/^ng$/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])v/$1u/
translator:
  dictionary: vime_pinyin
  enable_word_completion: true
  preedit_format:
    - xform/([jqxy])v/$1u/
    - xform/([nl])ue/$1ve/
# English words typed in the same composition. Rime orders the candidates of
# both translators by quality, which the English weights set: a word that is
# not pinyin ranks above a Chinese sentence, and one that is pinyin, or is as
# short as an abbreviation, ranks after the Chinese candidates.
english:
  dictionary: vime_english
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  enable_encoder: false
  initial_quality: -1
