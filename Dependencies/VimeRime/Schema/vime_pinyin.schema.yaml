# Simplified Chinese full pinyin for Vime. Dictionaries come from rime-ice
# (GPL-3.0); see Scripts/build_rime_data.sh.
schema:
  schema_id: vime_pinyin
  name: Vime 拼音
  version: "1"
engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
  filters:
    - uniquifier
speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  initials: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - erase/^hm$/
    - erase/^m$/
    - erase/^n$/
    - erase/^ng$/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])v/$1u/
translator:
  dictionary: vime_pinyin
  enable_word_completion: true
  preedit_format:
    - xform/([jqxy])v/$1u/
    - xform/([nl])ue/$1ve/
