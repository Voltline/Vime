name: Resource check

# Runs Scripts/validate_app_resources.py for pull requests: component license
# notices, privacy policies in every language and their public Markdown, and
# string translations. Scripts/validate_rime_words.py checks the readings,
# sections and order of the Chinese word list. Documentation changes run it too, since the public
# privacy policies live under Docs.
on:
  pull_request:
    branches: [dev, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resource-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate App resources
        run: python3 Scripts/validate_app_resources.py

      # The pinned pinyin sources the word list is checked against, about 10 MB.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rime-sources
          key: rime-sources-${{ hashFiles('Scripts/build_rime_dicts.py') }}

      - name: Validate the Chinese word list
        run: python3 Scripts/validate_rime_words.py --cache "$RUNNER_TEMP/rime-sources"
