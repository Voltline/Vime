name: Unit tests

# Reports whether a pull request changes anything beyond documentation. The
# unit tests themselves run locally through Scripts/test.sh, not on GitHub.
on:
  pull_request:
    branches: [dev, beta]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ -n "$PR" ]; then
            code=false
            while read -r file; do
              case "$file" in
                *.md|Docs/*|site/*) ;;
                *) code=true ;;
              esac
            done < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
