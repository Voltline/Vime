name: Unit tests

# Runs VimeKeyboardTests on an iOS simulator for pull requests. The extension
# UI tests need the keyboard enabled in Settings, so they stay local.
# unit-tests is a required check, so the workflow runs for every pull request:
# when only documentation changed the job is skipped, which counts as passing.
on:
  pull_request:
    branches: [dev, beta]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ -n "$PR" ]; then
            code=false
            while read -r file; do
              case "$file" in
                *.md|Docs/*|site/*) ;;
                *) code=true ;;
              esac
            done < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  unit-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The project is saved by Xcode 27; this preview image is the one that has it.
    runs-on: xcode-27
    timeout-minutes: 70
    env:
      VIME_SIMULATOR: iPhone 17
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # Restored and saved separately: a combined cache step saves only when the
      # job succeeds, so a failed or timed-out run never seeded it.
      - name: Restore package cache
        id: spm
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/Vime-tests/SourcePackages
          key: spm-${{ hashFiles('Vime.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Booting first times the simulator's first-boot setup on its own, and the
      # UDID keeps xcodebuild on the device that was booted.
      - name: Boot simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          devices = [d for _, runtime in sorted(json.load(sys.stdin)["devices"].items())
                     for d in runtime if d["name"] == os.environ["VIME_SIMULATOR"]]
          print(devices[-1]["udid"] if devices else "")')
          [ -n "$udid" ] || { xcrun simctl list devices available; exit 1; }
          echo "VIME_SIMULATOR=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      # These stay in the local suite:
      # - testOrthographyAndSupplementalDictionaryAreSelectable records a model
      #   expectation that the bundled model does not meet yet.
      # - The next five hold product time budgets set for real devices (neural
      #   ranking before first display, bounded correction search, recall
      #   latency, idle correction within its wait); the three-core runner
      #   misses them without a regression.
      #   KeyboardBudgetTests covers performance here, with room for the runner.
      # - A StoreKitTest purchase never returns on the runner.
      # Timing-bound tests get one retry on a shared runner. A test that hangs
      # fails after five minutes instead of using up the job.
      - name: Run unit tests
        timeout-minutes: 45
        run: |
          Scripts/test.sh -- \
            -skip-testing:VimeKeyboardTests/KeyboardSegmentedConversionTests/testOrthographyAndSupplementalDictionaryAreSelectable \
            -skip-testing:VimeKeyboardTests/KeyboardCandidateStabilityTests/testWarmModelStillRanksBeforeFirstDisplay \
            -skip-testing:VimeKeyboardTests/KeyboardCorrectionTests/testDictionaryCorpusAndBoundedSearch \
            -skip-testing:VimeKeyboardTests/KeyboardLongInputCorrectionTests/testCorrectionJoinsTheFirstDisplayInsteadOfTheEnd \
            -skip-testing:VimeKeyboardTests/KeyboardPersonalRecallTests/testFullReadingPopulationRecallStaysWithinInteractiveBudget \
            -skip-testing:VimeKeyboardTests/KeyboardCorrectionTests/testProfileIdleCorrectionPublicationAndMemory \
            -skip-testing:VimeKeyboardTests/TipJarTests/testTipsLoadAsConsumablesInPriceOrderAndPurchaseThanks \
            -retry-tests-on-failure -test-iterations 2 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300

      - name: Save package cache
        if: always() && steps.spm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/Vime-tests/SourcePackages
          key: spm-${{ hashFiles('Vime.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Each run lists the latency and memory budgets on the job summary.
      - name: Report budgets
        if: always()
        run: |
          log=~/Library/Developer/Xcode/DerivedData/Vime-tests/Results/VimeKeyboardTests.log
          {
            echo "### Latency and memory budgets"
            echo '```'
            grep -h "^VIME_BUDGET " "$log" 2>/dev/null | sed 's/^VIME_BUDGET //' || echo "no budget lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ~/Library/Developer/Xcode/DerivedData/Vime-tests/Results
          retention-days: 7
