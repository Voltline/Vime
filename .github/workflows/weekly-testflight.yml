name: Weekly TestFlight cut

# Wednesday to Friday 03:00 Asia/Shanghai. Moving beta starts the Xcode Cloud
# workflow that archives the branch and uploads it to TestFlight; days without
# new changes on dev are skipped.
on:
  schedule:
    - cron: "0 19 * * 2-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-branches
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      # Branch rulesets let only the release deploy key update dev, beta and
      # main directly, so the checkout pushes over SSH with that key.
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Check for changes
        id: changes
        run: |
          git fetch --tags origin main beta
          count=$(git rev-list --count --no-merges origin/beta..origin/dev)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          [ "$count" -gt 0 ] || echo "dev has no changes since the last cut."

      # docs/, chore/ and build/ pull requests may merge into beta directly.
      # Bring them back to dev so beta can fast-forward again.
      - name: Merge beta back into dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$(git rev-list --count HEAD..origin/beta)" -gt 0 ]; then
            git merge --no-ff --no-edit -m "Merge branch 'beta' into dev" origin/beta
            git push origin HEAD:dev
          fi

      - name: Set the marketing version on dev
        id: version
        if: steps.changes.outputs.count != '0'
        run: |
          version=$(python3 Scripts/release_version.py next --base-ref origin/main --write)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! git diff --quiet; then
            git commit -am "chore: set version to $version"
            git push origin HEAD:dev
          fi

      - name: Fast-forward beta to dev
        if: steps.changes.outputs.count != '0'
        run: git push origin HEAD:beta

      - name: Prepare the draft release notes
        if: steps.changes.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          previous=$(git tag --merged origin/main --list 'v*' --sort=-v:refname | head -n 1)
          changes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$tag" -f target_commitish="$(git rev-parse HEAD)" \
            ${previous:+-f previous_tag_name="$previous"} --jq .body)
          # Notes written earlier this week stay: from this version's draft, or
          # from an earlier cut's draft when a feature has raised the version.
          localized=""
          drafts=$(gh release list --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName')
          for draft in "$tag" $drafts; do
            if [ -z "$localized" ] && gh release view "$draft" >/dev/null 2>&1; then
              localized=$(gh release view "$draft" --json body --jq .body | tr -d '\r' | sed '/^---$/,$d')
            fi
          done
          for draft in $drafts; do
            [ "$draft" = "$tag" ] || gh release delete "$draft" --yes
          done
          if [ -z "$localized" ]; then
            localized=$(for locale in zh-Hans zh-Hant ja en-US ko; do printf '## %s\n\n\n' "$locale"; done)
          fi
          # Each cut is a new build, so the header and an empty 验收构建 line
          # are written again; the Saturday workflow submits only the build
          # entered there.
          {
            echo "<!-- 周六提交审核前：真机验收最新的 TestFlight 构建后，在「验收构建」后填写它的构建号；在各语言标题下填写 App Store「此版本的新增内容」。--- 以下仅供参考，不会提交。 -->"
            echo "验收构建："
            echo
            printf '%s\n' "$localized" | sed -E '/^<!--.*-->$/d; /^验收构建/d' | sed '/./,$!d'
            printf -- '---\n\n%s\n' "$changes"
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --target "$(git rev-parse HEAD)" --notes-file notes.md
          else
            gh release create "$tag" --draft --title "Vime $VERSION" \
              --target "$(git rev-parse HEAD)" --notes-file notes.md
          fi
